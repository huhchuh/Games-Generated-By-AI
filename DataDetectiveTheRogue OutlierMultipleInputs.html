<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Data Detective: The Rogue Outlier</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-correct: #10b981;
            --accent-error: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 75vh / 25vh Viewport Boundary Split */
        #game-area {
            height: 75vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        #footer-controls {
            height: 25vh;
            background-color: var(--card-bg);
            border-top: 2px solid #334155;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .header-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .score-box { font-size: 1.2rem; font-weight: bold; color: var(--accent-blue); }
        .timer-box { font-size: 1.2rem; font-weight: bold; color: var(--accent-error); }

        #stream-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        /* Accessible Touch Safety Targets (min-height 58px) */
        .data-row {
            background-color: #273549;
            border: 2px solid #475569;
            border-radius: 8px;
            min-height: 58px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
            touch-action: manipulation;
        }

        .data-row:active {
            background-color: #334155;
        }

        /* Data Modification Configuration Panel */
        #config-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75vh;
            background-color: var(--bg-color);
            z-index: 20;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid var(--accent-blue);
        }

        textarea {
            width: 100%;
            flex-grow: 1;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #475569;
            padding: 10px;
            font-family: monospace;
            border-radius: 6px;
            resize: none;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            min-height: 48px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-secondary { background-color: #475569; }
        .btn-success { background-color: var(--accent-correct); }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <div id="accessibility-announcer" class="sr-only" aria-live="polite"></div>

    <main id="game-area">
        <div class="header-ui">
            <div class="score-box">Score: <span id="score-val">0</span></div>
            <div id="data-source-indicator" style="font-size: 0.8rem; color: var(--text-muted)">Source: Local Simulation</div>
            <div class="timer-box">Time: <span id="timer-val">10.0</span>s</div>
        </div>

        <div id="stream-container">
            </div>
    </main>

    <section id="config-drawer">
        <h3>Connect Custom Data Source</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted);">
            Paste raw numeric sequences, CSV content, or JSON logs below.
        </p>
        <textarea id="data-input" placeholder="Example CSV Data Matrix Format:&#10;metric_name, numeric_value&#10;CPU_Core_01, 45&#10;CPU_Core_02, 48&#10;CPU_Core_03, 290 (Outlier)"></textarea>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="toggleConfig()">Cancel</button>
            <button class="btn btn-success" style="flex: 1;" onclick="loadCustomData()">Parse & Inject</button>
        </div>
    </section>

    <footer id="footer-controls">
        <p id="status-update" style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Find the anomaly item containing the mathematical outlier noise!
        </p>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" style="flex: 1;" onclick="toggleConfig()">⚙️ Connect Source Data</button>
            <button class="btn" style="flex: 1;" id="action-btn" onclick="initGame()">Start Game</button>
        </div>
    </footer>

    <script>
        let score = 0;
        let timeLeft = 10.0;
        let gameInterval = null;
        let isGameActive = false;
        let currentOutlierIndex = null;
        let baseTimeLimit = 10.0;

        // Fallback internal data configuration
        let internalDataset = [
            { label: "NODE_ALPHA", value: 51.2 },
            { label: "NODE_BETA", value: 49.8 },
            { label: "NODE_GAMMA", value: 53.1 },
            { label: "NODE_DELTA", value: 50.5 }
        ];
        let useDynamicGeneration = true;

        const announcer = document.getElementById("accessibility-announcer");
        const streamContainer = document.getElementById("stream-container");
        const scoreVal = document.getElementById("score-val");
        const timerVal = document.getElementById("timer-val");
        const statusUpdate = document.getElementById("status-update");
        const actionBtn = document.getElementById("action-btn");

        function announce(text) { announcer.textContent = text; }
        function toggleConfig() {
            const drawer = document.getElementById("config-drawer");
            drawer.style.display = drawer.style.display === "flex" ? "none" : "flex";
        }

        // Data processing and extraction engine
        function loadCustomData() {
            const rawText = document.getElementById("data-input").value.trim();
            if (!rawText) return;

            try {
                let parsedRows = [];
                if (rawText.startsWith("[") || rawText.startsWith("{")) {
                    // Process JSON structures
                    const obj = JSON.parse(rawText);
                    const array = Array.isArray(obj) ? obj : [obj];
                    array.forEach((item, idx) => {
                        let nums = Object.values(item).filter(v => typeof v === 'number');
                        if (nums.length > 0) parsedRows.push({ label: `JSON_ROW_${idx}`, value: nums[0] });
                    });
                } else {
                    // Process CSV / Plain text values
                    const lines = rawText.split("\n");
                    lines.forEach((line, idx) => {
                        const segments = line.split(/[\t,;]+/);
                        for (let seg of segments) {
                            let val = parseFloat(seg.trim());
                            if (!isNaN(val)) {
                                parsedRows.push({ label: `CSV_LN_${idx + 1}`, value: val });
                                break;
                            }
                        }
                    });
                }

                if (parsedRows.length < 3) {
                    alert("Data error: Need at least 3 numerical rows to identify an anomaly.");
                    return;
                }

                internalDataset = parsedRows;
                useDynamicGeneration = false;
                document.getElementById("data-source-indicator").textContent = "Source: Custom Dataset";
                statusUpdate.textContent = `Parsed ${parsedRows.length} custom data rows!`;
                toggleConfig();
                initGame();
            } catch (err) {
                alert("Parsing Exception: Verify data configuration arrays or text spacing.");
            }
        }

        function generateRound() {
            streamContainer.innerHTML = "";
            let roundItems = [];

            if (useDynamicGeneration) {
                let baseline = 80 + Math.random() * 200;
                let variance = baseline * 0.06;
                let isHighAnomaly = Math.random() > 0.5;
                let outlierMultiplier = isHighAnomaly ? (2.0 + Math.random()) : (0.1 + Math.random() * 0.2);

                let totalRows = 4;
                currentOutlierIndex = Math.floor(Math.random() * totalRows);

                for (let i = 0; i < totalRows; i++) {
                    if (i === currentOutlierIndex) {
                        roundItems.push({
                            label: `SYS_METRIC_0${i+1}`,
                            value: Math.round(baseline * outlierMultiplier)
                        });
                    } else {
                        roundItems.push({
                            label: `SYS_METRIC_0${i+1}`,
                            value: Math.round(baseline + (Math.random() * variance * 2 - variance))
                        });
                    }
                }
            } else {
                // Parse mathematical outlier dynamically using median absolute deviance principles
                let pool = [...internalDataset];
                let displayCount = Math.min(4, pool.length);
                let selected = [];
                for(let i=0; i<displayCount; i++) {
                    let randIdx = Math.floor(Math.random() * pool.length);
                    selected.push(pool.splice(randIdx, 1)[0]);
                }
                let mean = selected.reduce((sum, r) => sum + r.value, 0) / selected.length;
                let deviations = selected.map(r => Math.abs(r.value - mean));
                currentOutlierIndex = deviations.indexOf(Math.max(...deviations));
                roundItems = selected;
            }

            roundItems.forEach((item, index) => {
                const element = document.createElement("div");
                element.className = "data-row";
                element.setAttribute("role", "button");
                element.setAttribute("tabindex", "0");
                element.innerHTML = `<span>📊 [${item.label}]</span> <strong>${item.value}</strong>`;
                element.onclick = () => handleTap(index);
                streamContainer.appendChild(element);
            });

            announce("Pipeline refreshed. Choose the row with an out-of-bounds pattern variation.");
        }

        function handleTap(selectedIndex) {
            if (!isGameActive) return;

            if (selectedIndex === currentOutlierIndex) {
                score++;
                scoreVal.textContent = score;
                statusUpdate.textContent = "✅ System clean! Anomaly isolated.";
                statusUpdate.style.color = "var(--accent-correct)";
                
                baseTimeLimit = Math.max(2.5, 10.0 - (score * 0.5));
                timeLeft = baseTimeLimit;
                generateRound();
            } else {
                endGame(false);
            }
        }

        function initGame() {
            score = 0;
            baseTimeLimit = 10.0;
            timeLeft = baseTimeLimit;
            scoreVal.textContent = score;
            isGameActive = true;
            actionBtn.textContent = "Restart";
            statusUpdate.textContent = "Pipeline scanning active... Detect the anomaly row!";
            statusUpdate.style.color = "var(--text-muted)";
            
            if (gameInterval) clearInterval(gameInterval);
            generateRound();
            
            gameInterval = setInterval(() => {
                timeLeft -= 0.1;
                timerVal.textContent = Math.max(0, timeLeft).toFixed(1);
                if (timeLeft <= 0) endGame(true);
            }, 100);
        }

        function endGame(isTimeout) {
            isGameActive = false;
            clearInterval(gameInterval);
            timerVal.textContent = "0.0";
            
            const message = isTimeout ? "Pipeline Timeout! System Crashed." : "Validation Exception (Picked Clean Row Entry).";
            statusUpdate.textContent = `❌ Game Over: ${message} Final Score: ${score}`;
            statusUpdate.style.color = "var(--accent-error)";
            actionBtn.textContent = "Play Again";
            announce(`Game over. ${message}. High validation accuracy scored ${score} rounds.`);
        }
    </script>
</body>
</html>
