<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>JuicyJong Clone</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a0933;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: linear-gradient(180deg, #341663 0%, #1a0933 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        header {
            padding: 15px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid #522797;
        }
        h1 {
            font-size: 1.8rem;
            color: #ff3e6c;
            text-shadow: 0 0 10px #ff3e6c;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 20px;
            margin-top: 5px;
            font-weight: bold;
        }
        .stat-box {
            text-align: center;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 1.1rem;
            color: #00ffcc;
        }
        #mission-box {
            background: rgba(255, 62, 108, 0.15);
            border: 1px solid #ff3e6c;
            padding: 6px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffcc00;
        }
        #grid-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 100%;
            aspect-ratio: 7 / 8;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
            border-radius: 12px;
            border: 2px solid #441c84;
            position: relative;
        }
        .tile {
            background: radial-gradient(circle, #5929a3 0%, #3a1570 100%);
            border-radius: 8px;
            border-bottom: 4px solid #220946;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
        }
        .tile.selected {
            transform: scale(0.9);
            background: #ff3e6c;
            border-bottom-color: #b3163d;
            box-shadow: 0 0 15px #ff3e6c;
            z-index: 10;
        }
        .tile.empty {
            visibility: hidden;
            background: transparent;
            border: none;
        }
        .tile.match-anim {
            animation: explode 0.3s forwards;
        }
        @keyframes explode {
            0% { transform: scale(1); filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }
        #preview-line {
            position: absolute;
            background: rgba(0, 255, 204, 0.3);
            border: 2px dashed #00ffcc;
            pointer-events: none;
            display: none;
            border-radius: 8px;
            z-index: 5;
        }
        #footer-controls {
            padding: 15px;
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            border-top: 2px solid #522797;
        }
        .btn {
            background: linear-gradient(180deg, #ff3e6c 0%, #ba1c43 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #80102b;
            text-transform: uppercase;
            font-size: 0.85rem;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(12, 4, 26, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
            text-align: center;
            padding: 20px;
        }
        #overlay h2 {
            font-size: 2.5rem;
            color: #ffcc00;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255,204,0,0.4);
        }
        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #e0d5f0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1>Juicy Jong</h1>
        <div id="stats-bar">
            <div class="stat-box">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Moves Left</div>
                <div class="stat-value" id="moves">20</div>
            </div>
        </div>
    </header>

    <div id="mission-box">
        Mission: Collect <span id="target-count">15</span> Target Fruits!
    </div>

    <div id="grid-wrapper">
        <div id="grid"></div>
        <div id="preview-line"></div>
    </div>

    <div id="footer-controls">
        <button class="btn" onclick="useBonus('bomb')">💣 Bomb Boost</button>
        <button class="btn" onclick="resetGame()">Restart</button>
    </div>

    <div id="overlay">
        <h2 id="overlay-title">Level Complete!</h2>
        <p id="overlay-desc">You've cleared the juicy trial.</p>
        <button class="btn" id="overlay-btn" onclick="closeOverlay()">Next Level</button>
    </div>
</div>

<script>
    const ROWS = 8;
    const COLS = 7;
    const FRUITS = ['🍎', '🍊', '🍋', '🍇', '🍉', '🍓'];
    let TARGET_FRUIT = '🍎';
    
    let grid = [];
    let score = 0;
    let level = 1;
    let moves = 20;
    let targetGoal = 15;
    let collectedTarget = 0;
    
    let selectedTile = null;
    let isSwapping = false;
    let touchStartX = 0;
    let touchStartY = 0;

    const gridEl = document.getElementById('grid');
    const previewLine = document.getElementById('preview-line');

    function initGame() {
        score = 0;
        level = 1;
        setupLevel();
    }

    function setupLevel() {
        moves = 25 - Math.min(level, 5);
        targetGoal = 10 + (level * 5);
        collectedTarget = 0;
        TARGET_FRUIT = FRUITS[(level - 1) % FRUITS.length];
        
        updateUI();
        createBoard();
    }

    function createBoard() {
        gridEl.innerHTML = '';
        grid = [];
        
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                let type;
                // Avoid initiating immediate matches on generation
                do {
                    type = FRUITS[Math.floor(Math.random() * FRUITS.length)];
                } while (
                    (c >= 2 && grid[r][c-1] === type && grid[r][c-2] === type) ||
                    (r >= 2 && grid[r-1][c] === type && grid[r-2][c] === type)
                );
                
                grid[r][c] = type;
                createTileDOM(r, c, type);
            }
        }
    }

    function createTileDOM(r, c, type) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.row = r;
        tile.dataset.col = c;
        tile.innerText = type;

        // Mouse Controls
        tile.addEventListener('mousedown', (e) => handleStart(r, c, e.clientX, e.clientY));
        tile.addEventListener('mouseenter', () => handleHoverLanding(r, c));
        
        // Touch Controls
        tile.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleStart(r, c, touch.clientX, touch.clientY);
        }, {passive: true});

        tile.addEventListener('touchmove', handleTouchMove, {passive: false});

        gridEl.appendChild(tile);
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('level').innerText = level;
        document.getElementById('moves').innerText = moves;
        document.getElementById('mission-box').innerHTML = `Mission:
