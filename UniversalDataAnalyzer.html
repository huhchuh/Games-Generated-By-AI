<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Data Intake & Analysis Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #94a3b8;
        }
        input[type="text"], textarea {
            width: 100%;
            background-color: #0f172a;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            height: 120px;
            font-family: monospace;
            font-size: 13px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #7dd3fc; }
        button.secondary {
            background-color: #475569;
            color: #f8fafc;
        }
        button.secondary:hover { background-color: #64748b; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #334155;
        }
        th { color: #38bdf8; background-color: #0f172a; }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-opportunity { background-color: #16a34a; color: white; }
        .badge-event { background-color: #ea580c; color: white; }
        .badge-telemetry { background-color: #2563eb; color: white; }
        .status-msg { color: #38bdf8; font-style: italic; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 Universal Data Intake & Analysis Engine</h2>
    <p>Fetch messy lists from URLs or paste raw mixed-format text arrays to sanitize and picture them instantly.</p>

    <div class="card">
        <div class="form-group">
            <label for="urlInput">🌐 Option A: Stream Data via Remote URL</label>
            <input type="text" id="urlInput" placeholder="https://api.example.com/messy-logs-or-events.txt">
        </div>
        <div class="form-group">
            <label for="rawInput">📝 Option B: Direct Copy/Paste String Input</label>
            <textarea id="rawInput" placeholder="Paste structural text rows, CSV data, or semi-structured markdown fragments..."></textarea>
        </div>
        <div class="btn-group">
            <button onclick="processLocalInput()">Clean & Picture Data</button>
            <button class="secondary" onclick="fetchFromURL()">Fetch URL Directly</button>
            <button class="secondary" onclick="loadSampleData('opportunities')">Load Sample Opportunities</button>
            <button class="secondary" onclick="loadSampleData('events')">Load Sample Events</button>
        </div>
        <div id="statusOutput" class="status-msg"></div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>📈 Picture of the Data</h3>
            <div style="position: relative; height:300px;">
                <canvas id="analysisChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>📋 Standardized Normalized Table</h3>
            <div style="overflow-y: auto; max-height: 300px;">
                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Title / Label</th>
                            <th>Metric / Value</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" style="text-align:center; color:#64748b;">No data processed yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let currentChart = null;

// Built-in seed samples to test arbitrary layouts instantly
const samplePipelines = {
    opportunities: `[OPPORTUNITY] ID: 101 | Role: "Senior Web Developer" | Budget: $85000 | Location: Remote
!!! LOG DISRUPTION ERR 404 SYSTEM DELAY !!!
[OPPORTUNITY] ID: 102 | Role: "Mobile UI Designer" | Budget: $62000 | Location: Hybrid
[OPPORTUNITY] ID: 103 | Role: "Data Analyst Specialist" | Budget: $95000 | Location: Onsite
[OPPORTUNITY] ID: 104 | Role: "QA Integration Engineer" | Budget: $54000 | Location: Remote`,

    events: `TIMESTAMP: 1716681600, CATEGORY: Event, TEXT: "Global Tech Summit Kickoff", ATTENDEES: 1200
BAD STRING ERROR - OVERLAY ELEMENT FAILURE
TIMESTAMP: 1716685200, CATEGORY: Event, TEXT: "AI Open Source Workshop", ATTENDEES: 450
TIMESTAMP: 1716688800, CATEGORY: Event, TEXT: "HTML5 Mobile Gaming Hackathon", ATTENDEES: 850`
};

function loadSampleData(type) {
    document.getElementById('rawInput').value = samplePipelines[type];
    document.getElementById('statusOutput').innerText = `Loaded messy ${type} list into raw input buffer.`;
    processLocalInput();
}

// 1. Ingestion Layer: Remote Pulling
async function fetchFromURL() {
    const url = document.getElementById('urlInput').value;
    const status = document.getElementById('statusOutput');
    if (!url) {
        status.innerText = "Error: Please enter a target data source URL first.";
        return;
    }
    
    status.innerText = "Attempting connection to resource stream...";
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP status failure: ${response.status}`);
        const textData = await response.text();
        document.getElementById('rawInput').value = textData;
        status.innerText = "Data successfully pulled. Initiating cleaning logic...";
        processLocalInput();
    } catch (error) {
        status.innerText = `Network/CORS Restriction Note: Could not fetch from URL directly. Ensure the target web server supports cross-origin requests (CORS). Fallback: Paste the source array into text field manually.`;
        console.error(error);
    }
}

// 2. Formatting Parser Layer: Strip anomalies, map types, standardize rows
function processLocalInput() {
    const rawContent = document.getElementById('rawInput').value;
    const lines = rawContent.split('\n');
    const records = [];
    
    // Accumulator schema for visual representation
    const chartAggregator = {};

    lines.forEach(line => {
        const sanitizedLine = line.trim();
        if (!sanitizedLine) return; // Skip empty spacing lines

        let parsedRecord = null;

        // Dynamic Parsing Sequence A: Opportunities Format
        if (sanitizedLine.includes('[OPPORTUNITY]')) {
            try {
                const parts = sanitizedLine.split('|').map(p => p.trim());
                const role = parts[1].split(':')[1].replace(/"/g, '').trim();
                const budget = parseInt(parts[2].match(/\d+/)[0]);
                parsedRecord = { type: 'Opportunity', label: role, value: budget };
            } catch(e) {}
        }
        // Dynamic Parsing Sequence B: Events Format
        else if (sanitizedLine.includes('CATEGORY: Event')) {
            try {
                const textMatch = sanitizedLine.match(/TEXT:\s*"([^"]+)"/);
                const attendeesMatch = sanitizedLine.match(/ATTENDEES:\s*(\d+)/);
                if (textMatch && attendeesMatch) {
                    parsedRecord = {
                        type: 'Event',
                        label: textMatch[1],
                        value: parseInt(attendeesMatch[1])
                    };
                }
            } catch(e) {}
        }
        // Dynamic Parsing Sequence C: General Fallback for Game Telemetry / Raw CSV
        else if (sanitizedLine.includes('EVENT:') || sanitizedLine.includes('|')) {
            try {
                const segments = sanitizedLine.split('|').map(s => s.trim());
                if (segments.length >= 2) {
                    const label = segments[1].replace('EVENT:', '').trim();
                    const valMatch = segments[2] ? segments[2].match(/\d+/) : null;
                    const value = valMatch ? parseInt(valMatch[0]) : 1;
                    parsedRecord = { type: 'Telemetry', label: label, value: value };
                }
            } catch(e) {}
        }

        // If line matches any recognized pipeline, add it and aggregate metrics
        if (parsedRecord) {
            records.push(parsedRecord);
            chartAggregator[parsedRecord.label] = parsedRecord.value;
        }
    });

    renderUserViews(records, chartAggregator);
}

// 3. Visualization Layer: Draw the clean components onto the UI
function renderUserViews(records, chartData) {
    // Populate Data Grid
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#64748b;">No recognizable clean profiles found. Check your line configurations.</td></tr>`;
        return;
    }

    records.forEach(item => {
        const tr = document.createElement('tr');
        const badgeClass = `badge badge-${item.type.toLowerCase()}`;
        tr.innerHTML = `
            <td><span class="${badgeClass}">${item.type}</span></td>
            <td style="font-weight: 500;">${item.label}</td>
            <td style="font-family: monospace; color: #38bdf8;">${item.value.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
    });

    // Populate Picture Object (Bar Chart)
    const ctx = document.getElementById('analysisChart').getContext('2d');
    if (currentChart) currentChart.destroy(); // Tear down prior instances

    currentChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: Object.keys(chartData),
            datasets: [{
                label: 'Parsed Quantities / Values',
                data: Object.values(chartData),
                backgroundColor: ['#38bdf8', '#fbbf24', '#34d399', '#f87171', '#a78bfa', '#fb923c'],
                borderRadius: 5,
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
            }
        }
    });
}

// Seed window loop with an initial context state
window.onload = () => { loadSampleData('opportunities'); };
</script>
</body>
</html>
